<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Taskbar Hero build simulator — plan gear, passives, runes, and sockets. Compare attack damage and DPS before you commit." />
    <meta name="theme-color" content="#040306" />
    <title>TBH Wiki Helper — Build Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        var segments = location.pathname.split('/').filter(Boolean);
        var base = segments.length && segments[0] === 'taskbar-hero-wiki-helper' ? '/taskbar-hero-wiki-helper/' : '/';
        document.documentElement.style.setProperty(
          '--rpg-bg-image',
          'url("' + base + 'assets/ui/background.png")'
        );
      })();
    </script>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
